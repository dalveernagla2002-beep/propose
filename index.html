<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Journey For You ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.8s ease;
    }

    /* 5 अलग-अलग थीम्स */
    .theme-1 { background: linear-gradient(135deg, #1d3557, #457b9d); } /* Romantic Blue */
    .theme-2 { background: linear-gradient(135deg, #2b1055, #7597de); } /* Magic Purple */
    .theme-3 { background: linear-gradient(135deg, #0d1b2a, #415a77); } /* Midnight Stars */
    .theme-4 { background: linear-gradient(135deg, #d81159, #ffbc42); } /* Sunset Rose */
    .theme-5 { background: linear-gradient(135deg, #ff007f, #7928ca); } /* Neon Passion */

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      color: #fff;
      max-width: 420px;
      width: 90%;
      position: relative;
    }

    .step-indicator {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
      line-height: 1.4;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      min-height: 50px;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .yes-btn {
      background: #ff4757;
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
    }

    .yes-btn:hover {
      transform: scale(1.05);
    }

    .no-btn {
      background: #ffffff;
      color: #333;
      position: relative;
    }
  </style>
</head>
<body class="theme-1" id="bodyTheme">

  <div class="card" id="card">
    <div class="step-indicator" id="stepTag">Step 1 of 5</div>
    <h1 id="questionText">क्या आप मेरे साथ एक छोटी सी डिजिटल यात्रा पर चलना चाहेंगी? ✨</h1>
    
    <div class="btn-group" id="btnGroup">
      <button class="yes-btn" onclick="nextStep()">हाँ, बिल्कुल! ❤️</button>
      <button class="no-btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">नहीं 😜</button>
    </div>
  </div>

  <script>
    let currentStep = 1;

    // 5 अलग-अलग सवाल और उनकी थीम्स
    const stepsData = [
      {
        step: "Step 1 of 5",
        theme: "theme-1",
        question: "क्या आप मेरे साथ एक छोटी सी डिजिटल यात्रा पर चलना चाहेंगी? ✨",
        yesText: "हाँ, बिल्कुल! ❤️"
      },
      {
        step: "Step 2 of 5",
        theme: "theme-2",
        question: "अगर हमें कभी मौका मिले, तो क्या आप मेरे साथ एक कॉफ़ी डेट पर चलेंगी? ☕💕",
        yesText: "हाँ, ज़रूर! ☕"
      },
      {
        step: "Step 3 of 5",
        theme: "theme-3",
        question: "क्या आपको लगता है कि हमारी जोड़ी और बातें बहुत स्पेशल हैं? 🌟",
        yesText: "हाँ, बहुत ज़्यादा! 🥰"
      },
      {
        step: "Step 4 of 5",
        theme: "theme-4",
        question: "क्या आप वादा करती हैं कि चाहे जो हो जाए, आप हमेशा ऐसे ही मुस्कुराती रहेंगी? 😊",
        yesText: "पक्का वादा! 💖"
      },
      {
        step: "Step 5 of 5",
        theme: "theme-5",
        question: "Will you stay forever with me, Meri Jaan? 💍✨",
        yesText: "YES! Forever Yours! ❤️"
      }
    ];

    function nextStep() {
      currentStep++;
      
      if (currentStep <= 5) {
        const data = stepsData[currentStep - 1];
        
        // थीम बदलना
        document.getElementById('bodyTheme').className = data.theme;
        
        // कंटेंट बदलना
        document.getElementById('stepTag').innerText = data.step;
        document.getElementById('questionText').innerText = data.question;
        
        // 'No' बटन को वापस सामान्य जगह लाना
        const noBtn = document.getElementById('noBtn');
        noBtn.style.position = 'relative';
        noBtn.style.left = '0px';
        noBtn.style.top = '0px';
      } else {
        // फाइनल मैसेज
        document.getElementById('bodyTheme').className = 'theme-5';
        document.getElementById('card').innerHTML = `
          <h1 style="font-size: 28px;">Yay! I Love You So Much! 💖🎉</h1>
          <p style="font-size: 16px; margin-top: 15px; line-height: 1.6;">
            आपने मेरा दिल जीत लिया! <br> यह सफर हमेशा के लिए खास रहेगा। 🥰✨
          </p>
        `;
      }
    }

    // 'No' बटन को भगाने का फंक्शन
    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 80);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 80);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }
  </script>

</body>
</html>
