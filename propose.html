<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #2b1055, #7597de);
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      text-align: center;
      color: #fff;
      max-width: 400px;
      width: 90%;
      position: relative;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 25px;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    #yesBtn {
      background-color: #ff4757;
      color: white;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
    }
    #noBtn {
      background-color: #ffffff;
      color: #333;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1 id="question">Will you stay forever with me, Meri Jaan? 💕</h1>
    <div class="btn-group">
      <button id="yesBtn" onclick="acceptProposal()">Yes! ❤️</button>
      <button id="noBtn" onmouseover="moveButton()">No 😜</button>
    </div>
  </div>

  <script>
    // 'No' बटन पर माउस जाते ही वह दूर भागेगा
    function moveButton() {
      const noBtn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    // 'Yes' दबाने पर मैसेज बदलेगा
    function acceptProposal() {
      const card = document.getElementById('card');
      card.innerHTML = `
        <h1>Yay! I Love You Forever! 💖🎉</h1>
        <p style="font-size: 18px; margin-top: 15px;">You made my day special! 🥰</p>
      `;
    }
  </script>

</body>
</html>
